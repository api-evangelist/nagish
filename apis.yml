name: Nagish
description: Nagish (now operating as Rylo, following an $85M raise and rebrand) is a
  free phone-call captioning and live-transcription service for people who are Deaf,
  hard of hearing, or have a speech disability. Originally launched as the Nagish app
  (talknagish.com), the FCC-certified service delivers real-time captions on incoming
  and outgoing calls, in-person Live Transcribe, voicemail captioning, 50+ language
  support, and AI-powered quick replies, with transcripts kept private on-device. It
  is a consumer mobile/telecom product and publishes no public API, SDK, or developer
  portal. Backed by Canaan Partners and Techstars; profiled in the API Evangelist
  network as a company lead.
